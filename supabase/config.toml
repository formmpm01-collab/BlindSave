project_id = "blindsave"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
enable_signup = true
enable_anonymous_sign_ins = true

[functions.analyze]
# We validate every JWT against Auth using getUser(). Works with asymmetric signing keys.
verify_jwt = false
import_map = "./functions/deno.json"
